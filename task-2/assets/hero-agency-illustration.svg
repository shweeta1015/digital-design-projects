<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lavenderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentLavender" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="500" cy="140" r="160" fill="url(#lavenderGlow)"/>
  <circle cx="120" cy="380" r="120" fill="url(#lavenderGlow)"/>
  <circle cx="340" cy="240" r="220" fill="#f5f3ff" opacity="0.6"/>

  <!-- Decorative Isometric Grid Dots -->
  <g fill="#c4b5fd" opacity="0.5">
    <circle cx="80" cy="60" r="3"/><circle cx="110" cy="60" r="3"/><circle cx="140" cy="60" r="3"/><circle cx="170" cy="60" r="3"/>
    <circle cx="80" cy="90" r="3"/><circle cx="110" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="170" cy="90" r="3"/>
    <circle cx="80" cy="120" r="3"/><circle cx="110" cy="120" r="3"/><circle cx="140" cy="120" r="3"/><circle cx="170" cy="120" r="3"/>
  </g>

  <!-- Main Central Browser Window (Macro Frame) -->
  <g filter="url(#softShadow)">
    <rect x="140" y="70" width="420" height="290" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect x="140" y="70" width="420" height="38" rx="16" fill="#f8fafc"/>
    <rect x="140" y="92" width="420" height="16" fill="#f8fafc"/>
    <line x1="140" y1="108" x2="560" y2="108" stroke="#ede9fe" stroke-width="1.5"/>
    <!-- Traffic lights -->
    <circle cx="165" cy="89" r="5" fill="#f87171"/>
    <circle cx="181" cy="89" r="5" fill="#fbbf24"/>
    <circle cx="197" cy="89" r="5" fill="#34d399"/>
    <!-- Search pill -->
    <rect x="230" y="78" width="240" height="22" rx="6" fill="#ede9fe" opacity="0.7"/>
    <rect x="245" y="85" width="100" height="8" rx="4" fill="#a78bfa" opacity="0.6"/>

    <!-- Canvas Inner Content: Wireframe & Graph -->
    <!-- Hero Block Inside Window -->
    <rect x="165" y="125" width="180" height="18" rx="5" fill="url(#primaryGrad)"/>
    <rect x="165" y="152" width="140" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="165" y="166" width="110" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="165" y="186" width="60" height="22" rx="6" fill="url(#accentLavender)"/>

    <!-- Data Analytics Bar Graph Inside Canvas -->
    <rect x="165" y="235" width="200" height="95" rx="10" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <line x1="175" y1="305" x2="355" y2="305" stroke="#f1f5f9" stroke-width="1"/>
    <!-- Bar series -->
    <rect x="185" y="275" width="16" height="30" rx="4" fill="#c4b5fd"/>
    <rect x="210" y="255" width="16" height="50" rx="4" fill="url(#accentLavender)"/>
    <rect x="235" y="280" width="16" height="25" rx="4" fill="#93c5fd"/>
    <rect x="260" y="245" width="16" height="60" rx="4" fill="url(#accentBlue)"/>
    <rect x="285" y="260" width="16" height="45" rx="4" fill="url(#primaryGrad)"/>
    <rect x="310" y="240" width="16" height="65" rx="4" fill="#7c3aed"/>
    <rect x="335" y="270" width="16" height="35" rx="4" fill="#60a5fa"/>

    <!-- Media Right Placeholder -->
    <rect x="380" y="125" width="160" height="205" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <!-- Mini UI Cards on Right Side -->
    <circle cx="430" cy="170" r="26" fill="url(#primaryGrad)"/>
    <rect x="400" y="210" width="120" height="10" rx="5" fill="#7c3aed" opacity="0.8"/>
    <rect x="415" y="228" width="90" height="8" rx="4" fill="#a78bfa" opacity="0.6"/>
    <!-- Pill Toggles -->
    <rect x="400" y="255" width="120" height="24" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="414" cy="267" r="8" fill="#3b82f6"/>
    <rect x="400" y="290" width="120" height="24" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="506" cy="302" r="8" fill="#8b5cf6"/>
  </g>

  <!-- Foreground Floating Smartphone UI (Left) -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="170" width="130" height="240" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <!-- Phone speaker notch -->
    <rect x="115" y="178" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <!-- Phone screen content -->
    <rect x="85" y="195" width="100" height="60" rx="10" fill="url(#primaryGrad)"/>
    <!-- Metric inside phone -->
    <text x="135" y="225" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+148%</text>
    <text x="135" y="240" font-family="system-ui, sans-serif" font-size="8" fill="#e0e7ff" text-anchor="middle">Active Reach</text>
    <rect x="85" y="268" width="100" height="24" rx="6" fill="#f5f3ff"/>
    <circle cx="98" cy="280" r="5" fill="#7c3aed"/>
    <rect x="110" y="277" width="60" height="6" rx="3" fill="#6d28d9"/>
    <rect x="85" y="300" width="100" height="24" rx="6" fill="#eff6ff"/>
    <circle cx="98" cy="312" r="5" fill="#2563eb"/>
    <rect x="110" y="309" width="60" height="6" rx="3" fill="#1d4ed8"/>
    <rect x="85" y="332" width="100" height="24" rx="6" fill="#f5f3ff"/>
    <circle cx="98" cy="344" r="5" fill="#8b5cf6"/>
    <rect x="110" y="341" width="60" height="6" rx="3" fill="#7c3aed"/>
    <!-- Home Bar -->
    <rect x="115" y="398" width="40" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Floating Component Badge (Bottom Right) -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="310" width="180" height="80" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="452" cy="350" r="18" fill="url(#accentBlue)"/>
    <!-- Checkmark icon -->
    <path d="M446 350 L450 354 L459 345" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Optimal UX</text>
    <text x="480" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">100% Responsive</text>
  </g>

  <!-- Floating Design Color Palette Orb (Top Right) -->
  <g filter="url(#cardShadow)">
    <circle cx="530" cy="65" r="28" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <circle cx="530" cy="65" r="22" fill="url(#primaryGrad)"/>
    <!-- Sparkle star -->
    <path d="M530 52 L532 62 L542 65 L532 68 L530 78 L528 68 L518 65 L528 62 Z" fill="#ffffff"/>
  </g>
</svg>