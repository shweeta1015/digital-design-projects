<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#f1f5f9"/>
  <rect x="0" y="0" width="400" height="7" fill="#b45309"/>
  <!-- Glass Wall Partition & Door Frame -->
  <line x1="80" y1="20" x2="80" y2="230" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="320" y1="20" x2="320" y2="230" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Conference Wall Display / Digital Whiteboard -->
  <rect x="120" y="30" width="160" height="90" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="126" y="36" width="148" height="78" fill="#1e293b"/>
  <!-- Architecture / Flowchart diagram on big screen -->
  <rect x="140" y="50" width="35" height="20" rx="3" fill="#3b82f6"/>
  <rect x="225" y="50" width="35" height="20" rx="3" fill="#10b981"/>
  <rect x="182" y="85" width="35" height="20" rx="3" fill="#f59e0b"/>
  <line x1="175" y1="60" x2="225" y2="60" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <line x1="157" y1="70" x2="182" y2="90" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <line x1="242" y1="70" x2="217" y2="90" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <!-- Conference Table -->
  <ellipse cx="200" cy="175" rx="140" ry="35" fill="#334155" stroke="#475569" stroke-width="2"/>
  <ellipse cx="200" cy="172" rx="136" ry="32" fill="#1e293b"/>
  <!-- Table Base -->
  <rect x="190" y="195" width="20" height="35" fill="#0f172a"/>
  <ellipse cx="200" cy="230" rx="40" ry="8" fill="#0f172a"/>
  <!-- Executive Chairs around table -->
  <circle cx="100" cy="170" r="16" fill="#475569"/>
  <rect x="94" y="150" width="12" height="15" rx="4" fill="#64748b"/>
  <circle cx="300" cy="170" r="16" fill="#475569"/>
  <rect x="294" y="150" width="12" height="15" rx="4" fill="#64748b"/>
  <circle cx="150" cy="195" r="16" fill="#475569"/>
  <rect x="144" y="190" width="12" height="15" rx="4" fill="#64748b"/>
  <circle cx="250" cy="195" r="16" fill="#475569"/>
  <rect x="244" y="190" width="12" height="15" rx="4" fill="#64748b"/>
  <!-- Modern indoor plant -->
  <rect x="20" y="130" width="30" height="40" rx="3" fill="#94a3b8"/>
  <path d="M 35 130 Q 15 90 20 60 Q 40 85 35 130 Z" fill="#059669"/>
  <path d="M 35 130 Q 55 90 50 60 Q 30 85 35 130 Z" fill="#10b981"/>
</svg>
